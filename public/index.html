<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Be Studios Copilot</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="mark">B</div><div><h1>Be Studios Copilot</h1><p>Paste a customer message. Get a reply ready to send.</p></div></header><section class="card"><label for="message">Customer message</label><textarea id="message" placeholder="e.g. Hi! I've never done Pilates before. Which class should I book?"></textarea><button id="send">Create reply</button></section><section id="answerCard" class="card answer hidden"><div class="answerTop"><label>Ready to send</label><button id="copy" class="secondary">Copy</button></div><div id="answer"></div></section><p id="status"></p></main><script src="/app.js"></script></body></html>
