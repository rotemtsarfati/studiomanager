<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Be Studios Copilot</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="mark">B</div><div><h1>Be Studios Copilot</h1><p>Paste a customer message or upload chat screenshots. Get a reply ready to send.</p></div></header><section class="card"><label for="message">Latest customer message</label><textarea id="message" placeholder="Paste the newest message here. If the screenshot already shows it clearly, you can leave this empty."></textarea><div class="uploadRow"><label class="uploadButton" for="screenshots">Upload screenshot(s)</label><input id="screenshots" type="file" accept="image/*" multiple><span id="imageCount">No screenshots added</span></div><div id="preview" class="preview"></div><div class="actions"><button id="send">Create reply</button><button id="clearMessage" class="secondary" type="button">Clear message</button><button id="clearConversation" class="secondary danger" type="button">Clear conversation</button></div></section><section id="contextCard" class="card hidden"><div class="answerTop"><label>Conversation context</label><span id="turnCount"></span></div><div id="history" class="history"></div></section><section id="answerCard" class="card answer hidden"><div class="answerTop"><label>Ready to send</label><button id="copy" class="secondary">Copy</button></div><div id="answer"></div><div class="feedbackPanel"><label for="feedback">Want the AI to change this reply?</label><div class="voiceRow"><button id="voiceFeedback" class="secondary micButton" type="button" aria-label="Dictate revision feedback">🎙️ Speak</button><select id="voiceLanguage" aria-label="Voice language"><option value="he-IL">עברית</option><option value="en-US">English</option></select><span id="voiceStatus" class="hint"></span></div><textarea id="feedback" class="feedbackText" placeholder="Tell it what to change — you can type or dictate in Hebrew or English."></textarea><div class="feedbackActions"><label class="rememberLabel"><input id="rememberGuidance" type="checkbox" checked> Remember this guidance for future replies</label><button id="refine" type="button">Revise reply</button></div><div id="guidanceStatus" class="hint"></div></div></section><p id="status"></p></main><script src="/app.js"></script></body></html>
