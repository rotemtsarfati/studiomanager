<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Be Studios Voice</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#faf9f6}
    *{box-sizing:border-box} body{margin:0;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.08);text-align:center}
    h1{font-size:20px;margin:0 0 8px} p{font-size:14px;color:#6b7280;line-height:1.45}button{border:0;border-radius:999px;padding:14px 22px;font-size:16px;font-weight:800;cursor:pointer;background:#111827;color:#fff;min-width:190px}button.recording{background:#991b1b}.status{margin-top:18px;font-weight:800;min-height:24px}.error{color:#b91c1c}.ok{color:#047857}.hint{font-size:12px;color:#6b7280;margin-top:16px}
  </style>
</head>
<body>
  <div class="card">
    <h1>🎙 Voice instruction</h1>
    <p>Speak in Hebrew or English. Press Stop when you finish.</p>
    <button id="record">Start recording</button>
    <div id="status" class="status">Ready</div>
    <div class="hint">The recording is used only to turn your instruction into text.</div>
  </div>
<script>
  const recordButton=document.getElementById('record');
  const statusBox=document.getElementById('status');
  let recorder=null,stream=null,chunks=[];
  function status(text,type=''){statusBox.textContent=text;statusBox.className='status '+type;}
  function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=reject;r.readAsDataURL(blob);});}
  async function start(){
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[];
      const preferred=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported?.(t));
      recorder=new MediaRecorder(stream,preferred?{mimeType:preferred}:undefined);
      recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      recorder.onstop=async()=>{
        try{
          status('Transcribing…');
          const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
          const audio=await blobToDataUrl(blob);
          const response=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio})});
          const body=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(body.error||'Could not transcribe voice note.');
          const text=String(body.text||'').trim();
          if(!text)throw new Error('No speech was detected.');
          if(window.opener)window.opener.postMessage({event:'be-studios-voice-transcript',text},location.origin);
          status('Added to Chatwoot ✓','ok');
          setTimeout(()=>window.close(),650);
        }catch(e){status(e.message||'Could not transcribe voice note.','error');recordButton.disabled=false;recordButton.textContent='Try again';}
      };
      recorder.start();
      recordButton.textContent='⏹ Stop recording';
      recordButton.classList.add('recording');
      status('Listening…');
    }catch(e){status('Microphone access is blocked. Please allow microphone access for this page and try again.','error');recordButton.textContent='Try again';}
  }
  function stop(){
    if(recorder&&recorder.state==='recording')recorder.stop();
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    recordButton.disabled=true;recordButton.classList.remove('recording');recordButton.textContent='Processing…';
  }
  recordButton.addEventListener('click',()=>{if(recorder&&recorder.state==='recording')stop();else start();});
</script>
</body>
</html>
